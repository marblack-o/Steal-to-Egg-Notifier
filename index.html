<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Steal to Egg Notifier</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Egg Notifier" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a22;
      --border: #2a2a35;
      --text: #e8e8ed;
      --muted: #9a9aad;
      --accent: #7c5cff;
      --accent-hover: #9478ff;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      line-height: 1.45;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 8px;
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      background: #121218;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: #555;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #2a2a35;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #353545;
    }

    .btn-copy {
      background: var(--success);
      color: #04140a;
      width: 100%;
      margin-top: 12px;
      font-size: 1.05rem;
      padding: 16px;
    }

    .btn-copy:hover {
      filter: brightness(1.08);
    }

    .btn-copy.copied {
      background: #16a34a;
    }

    .btn-url {
      background: #8b5cf6;
      color: white;
      width: 100%;
      margin-top: 10px;
      font-size: 1rem;
      padding: 14px;
    }

    .btn-url:hover {
      filter: brightness(1.08);
    }

    .btn-url:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-download {
      background: #3b82f6;
      color: white;
      width: 100%;
      margin-top: 10px;
      font-size: 1rem;
      padding: 14px;
    }

    .btn-download:hover {
      filter: brightness(1.08);
    }

    .btn-download:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .preview {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.98rem;
      line-height: 1.55;
      background: #121218;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      min-height: 120px;
    }

    .preview.empty {
      color: var(--muted);
      font-style: italic;
    }

    .egg-image-wrap {
      text-align: center;
      margin-bottom: 14px;
      display: none;
    }

    .egg-image-wrap.show {
      display: block;
    }

    .egg-image {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 12px;
      background: #1a1a22;
      border: 1px solid var(--border);
    }

    .egg-image.loading {
      opacity: 0.4;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 10px;
      min-height: 20px;
    }

    .status.success {
      color: var(--success);
    }

    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.78rem;
      color: #555;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #22c55e;
      color: #04140a;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Huevos en esta partida ===== */
    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .session-header label {
      margin-bottom: 0;
    }

    .btn-clear-session {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .egg-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .egg-item {
      background: #121218;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .egg-item-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
    }

    .egg-item-header:active {
      background: #1a1a24;
    }

    .egg-rank {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      min-width: 22px;
    }

    .egg-thumb {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: contain;
      background: #1a1a22;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .egg-main {
      flex: 1;
      min-width: 0;
    }

    .egg-name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .egg-money {
      font-size: 0.82rem;
      color: #4ade80;
      margin-top: 2px;
    }

    .egg-arrow {
      font-size: 0.9rem;
      color: var(--muted);
      transition: transform 0.2s;
    }

    .egg-item.open .egg-arrow {
      transform: rotate(90deg);
    }

    .egg-details {
      display: none;
      padding: 0 14px 14px;
      border-top: 1px solid var(--border);
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .egg-item.open .egg-details {
      display: block;
      padding-top: 12px;
    }

    .egg-details a {
      color: #7c5cff;
      word-break: break-all;
    }

    .egg-empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 20px 10px;
      font-style: italic;
    }

    /* ===== Ciclo Día / Noche ===== */
    .cycle-card {
      text-align: center;
      padding: 18px 16px;
    }

    .cycle-phase {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .cycle-phase.day { color: #fbbf24; }
    .cycle-phase.night { color: #818cf8; }

    .cycle-timer {
      font-size: 2.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .cycle-timer.day { color: #fbbf24; }
    .cycle-timer.night { color: #a5b4fc; }

    .cycle-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .cycle-waiting {
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🥚 Steal to Egg Notifier</h1>
      <p>Notificaciones de huevos OP · Secret en adelante</p>
    </header>

    <div class="card">
      <label for="input">Mensaje de Discord</label>
      <textarea id="input" placeholder="Pega aquí el mensaje del bot de huevos..."></textarea>
      <div class="actions">
        <button class="btn-secondary" id="btnClear">Limpiar</button>
      </div>
    </div>

    <div class="card">
      <label>Versión limpia (WhatsApp)</label>
      <div class="egg-image-wrap" id="eggImageWrap">
        <img class="egg-image" id="eggImage" alt="Egg" />
      </div>
      <div class="preview empty" id="preview">Aquí aparecerá el mensaje listo para copiar...</div>
      <button class="btn-copy" id="btnCopy" disabled>Copiar para WhatsApp + Wiki</button>
      <button class="btn-url" id="btnUrl" disabled>Copiar URL Discord</button>
      <button class="btn-download" id="btnDownload" disabled>Descargar texto + imagen</button>
      <div class="status" id="status"></div>
    </div>

    <!-- Ciclo Día / Noche -->
    <div class="card cycle-card" id="cycleCard">
      <div class="cycle-waiting" id="cycleWaiting">Esperando huevos OP...</div>
      <div id="cycleActive" style="display:none">
        <div class="cycle-phase" id="cyclePhase">☀️ Día</div>
        <div class="cycle-timer" id="cycleTimer">5:00</div>
        <div class="cycle-sub" id="cycleSub">Próximo: Noche (10s)</div>
      </div>
    </div>

    <!-- Nueva sección: Huevos en esta partida -->
    <div class="card">
      <div class="session-header">
        <label>Huevos En Esta Partida</label>
        <button class="btn-clear-session" id="btnClearSession">Borrar lista</button>
      </div>
      <div class="egg-list" id="eggList">
        <div class="egg-empty">Esperando huevos OP...</div>
      </div>
    </div>

    <footer>
      Solo se procesa en tu dispositivo · Sin conexión a servidores
    </footer>
  </div>

  <div class="toast" id="toast">¡Copiado!</div>

  <script>
    const input = document.getElementById('input');
    const preview = document.getElementById('preview');
    const btnClear = document.getElementById('btnClear');
    const btnCopy = document.getElementById('btnCopy');
    const btnUrl = document.getElementById('btnUrl');
    const btnDownload = document.getElementById('btnDownload');
    const btnClearSession = document.getElementById('btnClearSession');
    const status = document.getElementById('status');
    const toast = document.getElementById('toast');
    const eggImageWrap = document.getElementById('eggImageWrap');
    const eggImage = document.getElementById('eggImage');
    const eggList = document.getElementById('eggList');

    let lastEggName = 'Egg';
    let lastEmojiId = null;
    let lastImageUrl = '';
    let lastEggData = null; // datos parseados del último huevo

    // ===== Sesión de huevos (localStorage) =====
    const SESSION_KEY = 'egg_session_v1';

    function loadSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveSession(list) {
      localStorage.setItem(SESSION_KEY, JSON.stringify(list));
    }

    // Parsea valores tipo "$225m/s", "20.5M", "1.2b", "500k"
    function parseMoney(str) {
      if (!str) return 0;
      const cleaned = str.replace(/[~$\s,/s]/gi, '').toLowerCase();
      const match = cleaned.match(/^([\d.]+)([kmb])?$/i);
      if (!match) return 0;
      let num = parseFloat(match[1]);
      const unit = (match[2] || '').toLowerCase();
      if (unit === 'k') num *= 1e3;
      if (unit === 'm') num *= 1e6;
      if (unit === 'b') num *= 1e9;
      return num;
    }

    function formatMoney(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(n);
    }

    function addEggToSession(egg) {
      let list = loadSession();
      const wasEmpty = list.length === 0;

      // Evitar duplicados por nombre (actualiza si ya existe)
      const idx = list.findIndex(e => e.name.toLowerCase() === egg.name.toLowerCase());
      if (idx >= 0) {
        list[idx] = egg;
      } else {
        list.push(egg);
      }
      // Ordenar de mayor a menor dinero
      list.sort((a, b) => b.moneyValue - a.moneyValue);
      saveSession(list);
      renderSession();

      // Iniciar el ciclo con el primer huevo
      if (wasEmpty) {
        startCycle();
      }
    }

    function renderSession() {
      const list = loadSession();
      if (list.length === 0) {
        eggList.innerHTML = '<div class="egg-empty">Esperando huevos OP...</div>';
        return;
      }

      eggList.innerHTML = list.map((egg, i) => `
        <div class="egg-item" data-idx="${i}">
          <div class="egg-item-header">
            <span class="egg-rank">#${i + 1}</span>
            ${egg.imageUrl ? `<img class="egg-thumb" src="${egg.imageUrl}" alt="${egg.name}" loading="lazy" onerror="this.style.display='none'">` : ''}
            <div class="egg-main">
              <div class="egg-name">${egg.name}</div>
              <div class="egg-money">💰 ${egg.moneyText || formatMoney(egg.moneyValue) + '/s'}</div>
            </div>
            <span class="egg-arrow">▶</span>
          </div>
          <div class="egg-details">
            ${egg.location ? `<div>😈 <b>Location:</b> ${egg.location}</div>` : ''}
            ${egg.spawned ? `<div>⏱ <b>Spawned:</b> ${egg.spawned}</div>` : ''}
            ${egg.speed ? `<div>⚡ <b>Speed:</b> ${egg.speed}</div>` : ''}
            ${egg.wiki ? `<div>🔍 <b>Wiki:</b> <a href="${egg.wiki}" target="_blank" rel="noopener">${egg.wiki}</a></div>` : ''}
            ${egg.join ? `<div>🎮 <b>Join:</b> <a href="${egg.join}" target="_blank" rel="noopener">Click aquí</a></div>` : ''}
            <div style="margin-top:8px">
              <button class="btn-secondary" style="padding:8px 12px;font-size:0.8rem" onclick="copyEggText(${i})">Copiar texto</button>
            </div>
          </div>
        </div>
      `).join('');

      // Toggle expand
      eggList.querySelectorAll('.egg-item-header').forEach(header => {
        header.addEventListener('click', () => {
          header.parentElement.classList.toggle('open');
        });
      });
    }

    function copyEggText(idx) {
      const list = loadSession();
      const egg = list[idx];
      if (!egg || !egg.fullText) return;
      navigator.clipboard.writeText(egg.fullText).then(() => showToast('Texto copiado'));
    }

    btnClearSession.addEventListener('click', () => {
      if (confirm('¿Borrar todos los huevos de esta partida?')) {
        saveSession([]);
        renderSession();

        // Reiniciar el ciclo
        if (cycleInterval) clearInterval(cycleInterval);
        cycleRunning = false;
        cyclePhase = 'day';
        cycleRemaining = DAY_SECONDS;
        cycleWaiting.style.display = 'block';
        cycleActive.style.display = 'none';

        showToast('Lista borrada');
      }
    });

    // Cargar lista al iniciar
    renderSession();

    // ===== Ciclo Día (5 min) / Noche (10 s) =====
    const DAY_SECONDS = 5 * 60;   // 5 minutos
    const NIGHT_SECONDS = 10;     // 10 segundos

    let cycleRunning = false;
    let cyclePhase = 'day';      // 'day' | 'night'
    let cycleRemaining = DAY_SECONDS;
    let cycleInterval = null;

    const cycleWaiting = document.getElementById('cycleWaiting');
    const cycleActive = document.getElementById('cycleActive');
    const cyclePhaseEl = document.getElementById('cyclePhase');
    const cycleTimerEl = document.getElementById('cycleTimer');
    const cycleSubEl = document.getElementById('cycleSub');

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function updateCycleUI() {
      if (cyclePhase === 'day') {
        cyclePhaseEl.textContent = '☀️ Día';
        cyclePhaseEl.className = 'cycle-phase day';
        cycleTimerEl.className = 'cycle-timer day';
        cycleSubEl.textContent = 'Próximo: Noche (10s)';
      } else {
        cyclePhaseEl.textContent = '🌙 Noche';
        cyclePhaseEl.className = 'cycle-phase night';
        cycleTimerEl.className = 'cycle-timer night';
        cycleSubEl.textContent = 'Próximo: Día (5:00)';
      }
      cycleTimerEl.textContent = formatTime(cycleRemaining);
    }

    function tickCycle() {
      cycleRemaining--;
      if (cycleRemaining < 0) {
        // Cambiar de fase
        if (cyclePhase === 'day') {
          // Terminó el día → limpiar lista de huevos y pasar a noche
          cyclePhase = 'night';
          cycleRemaining = NIGHT_SECONDS;
          saveSession([]);
          renderSession();
        } else {
          // Terminó la noche → nuevo día
          cyclePhase = 'day';
          cycleRemaining = DAY_SECONDS;
        }
      }
      updateCycleUI();
    }

    function startCycle() {
      if (cycleRunning) return;
      cycleRunning = true;
      cyclePhase = 'day';
      cycleRemaining = DAY_SECONDS;

      cycleWaiting.style.display = 'none';
      cycleActive.style.display = 'block';
      updateCycleUI();

      cycleInterval = setInterval(tickCycle, 1000);
    }

    // Si ya hay huevos guardados de antes, iniciar el ciclo
    if (loadSession().length > 0) {
      startCycle();
    }

    // Auto-transform on paste
    input.addEventListener('paste', () => {
      setTimeout(() => transform(), 50);
    });

    // Also transform when user finishes typing (debounced)
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        if (input.value.trim().length > 30) transform();
      }, 600);
    });

    btnClear.addEventListener('click', () => {
      input.value = '';
      preview.textContent = 'Aquí aparecerá el mensaje listo para copiar...';
      preview.classList.add('empty');
      btnCopy.disabled = true;
      btnUrl.disabled = true;
      btnDownload.disabled = true;
      status.textContent = '';
      eggImageWrap.classList.remove('show');
      eggImage.src = '';
      lastEggName = 'Egg';
      lastEmojiId = null;
      lastImageUrl = '';
      input.focus();
    });

    btnCopy.addEventListener('click', async () => {
      const text = preview.textContent;
      if (!text || preview.classList.contains('empty')) return;

      try {
        await navigator.clipboard.writeText(text);
        showToast('¡Copiado!');
        btnCopy.textContent = '✓ Copiado';
        btnCopy.classList.add('copied');
        status.textContent = 'Listo, pégalo en WhatsApp';
        status.classList.add('success');

        setTimeout(() => {
          btnCopy.textContent = 'Copiar para WhatsApp + Wiki';
          btnCopy.classList.remove('copied');
        }, 2000);
      } catch (err)
