<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Steal to Egg Notifier</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Egg Notifier" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <style>
    :root {
      --bg: #0f0f13; --card: #1a1a22; --border: #2a2a35;
      --text: #e8e8ed; --muted: #9a9aad; --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100dvh; padding: 16px; line-height: 1.45;
    }
    .container { max-width: 520px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding-top: 4px; }
    .topbar h1 { font-size: 1.2rem; font-weight: 700; }
    .topbar p { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
    .burger {
      width: 42px; height: 42px; border: 1px solid var(--border); background: var(--card);
      border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 5px; cursor: pointer;
    }
    .burger span { display: block; width: 18px; height: 2px; background: var(--text); border-radius: 2px; transition: 0.2s; }
    .burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); opacity: 0; pointer-events: none;
      transition: opacity 0.25s; z-index: 90;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; width: min(340px, 88vw); height: 100%;
      background: #14141c; border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.16,1,0.3,1);
      z-index: 100; overflow-y: auto; padding: 20px 16px 40px;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 18px; }
    .menu-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .menu-row label { font-size: 0.92rem; font-weight: 600; }
    .toggle-pill {
      min-width: 52px; padding: 6px 12px; border-radius: 999px; border: none;
      font-weight: 700; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .toggle-pill.off { background: #3f1212; color: #fca5a5; }
    .toggle-pill.on { background: #14532d; color: #86efac; }
    .toggle-pill.custom { background: #422006; color: #fde68a; }
    .filters-title {
      margin-top: 22px; font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
    }
    .filters-desc { font-size: 0.82rem; color: var(--muted); margin: 8px 0 14px; line-height: 1.4; }
    .cat {
      border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px;
      overflow: hidden; background: #121218;
    }
    .cat-header {
      display: flex; align-items: center; gap: 10px; padding: 12px;
      cursor: pointer; user-select: none;
    }
    .cat-header:active { background: #1a1a24; }
    .cat-eggs-preview {
      width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 8px; overflow: hidden;
      background: #1a1a22; border: 1px solid var(--border);
    }
    .cat-eggs-preview img {
      width: 100%; height: 100%; object-fit: contain;
      display: block;
    }
    .filter-thumb {
      width: 28px; height: 28px; border-radius: 6px;
      object-fit: contain; background: #1a1a22;
      border: 1px solid var(--border); flex-shrink: 0;
    }
    .egg-filter-left {
      display: flex; align-items: center; gap: 8px; min-width: 0;
    }
    .cat-name { flex: 1; font-weight: 600; font-size: 0.92rem; }
    .cat-arrow { color: var(--muted); font-size: 0.85rem; transition: transform 0.2s; }
    .cat.open .cat-arrow { transform: rotate(90deg); }
    .cat-body { display: none; border-top: 1px solid var(--border); padding: 6px 8px 10px; }
    .cat.open .cat-body { display: block; }
    .egg-filter {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 6px; border-radius: 8px;
    }
    .egg-filter:active { background: #1a1a24; }
    .egg-filter-name { font-size: 0.86rem; }
    .egg-filter .toggle-pill { min-width: 44px; padding: 4px 10px; font-size: 0.7rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px; margin-bottom: 14px;
    }
    .session-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .session-header label {
      font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--muted);
    }
    .btn-clear-session {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-size: 0.78rem; padding: 6px 10px; border-radius: 8px; cursor: pointer;
    }
    .last-seen { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; min-height: 1.2em; }
    .egg-list { display: flex; flex-direction: column; gap: 8px; }
    .egg-item {
      background: #121218; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    }
    .egg-item-header {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      cursor: pointer; user-select: none;
    }
    .egg-item-header:active { background: #1a1a24; }
    .egg-rank { font-size: 0.75rem; font-weight: 700; color: var(--muted); min-width: 22px; }
    .egg-thumb {
      width: 36px; height: 36px; border-radius: 8px; object-fit: contain;
      background: #1a1a22; border: 1px solid var(--border); flex-shrink: 0;
    }
    .egg-main { flex: 1; min-width: 0; }
    .egg-name {
      font-weight: 600; font-size: 0.95rem; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .egg-money { font-size: 0.82rem; color: #4ade80; margin-top: 2px; }
    .egg-ago { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .egg-arrow { font-size: 0.9rem; color: var(--muted); transition: transform 0.2s; }
    .egg-item.open .egg-arrow { transform: rotate(90deg); }
    .egg-details {
      display: none; padding: 0 14px 14px; border-top: 1px solid var(--border);
      font-size: 0.88rem; line-height: 1.6; color: var(--muted);
    }
    .egg-item.open .egg-details { display: block; padding-top: 12px; }
    .egg-details a { color: #7c5cff; word-break: break-all; }
    .egg-empty {
      text-align: center; color: var(--muted); font-size: 0.9rem;
      padding: 24px 10px; font-style: italic;
    }
    .btn-secondary {
      background: #2a2a35; color: var(--text); border: none; border-radius: 8px;
      padding: 8px 12px; font-size: 0.8rem; cursor: pointer;
    }
    footer {
      text-align: center; color: var(--muted); font-size: 0.75rem;
      margin-top: 8px; padding-bottom: 20px;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--green); color: #04140a; padding: 12px 22px;
      border-radius: 999px; font-weight: 600; font-size: 0.95rem;
      opacity: 0; transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
      pointer-events: none; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .rift-card { border-color: #4c1d95; }
    .rift-title {
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; color: #c4b5fd; margin-bottom: 8px;
    }
    .rift-meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
    .rift-pet {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-top: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .rift-pet img {
      width: 32px; height: 32px; border-radius: 8px; object-fit: contain;
      background: #1a1a22; border: 1px solid var(--border);
    }
    .rift-pet-name { font-weight: 600; flex: 1; }
    .rift-chance { color: #fbbf24; font-size: 0.8rem; margin-right: 8px; }
    .rift-money { color: #4ade80; font-size: 0.8rem; }
    .rift-empty { color: var(--muted); font-size: 0.85rem; font-style: italic; padding: 8px 0; }

    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80; margin-right: 6px; vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>Steal to Egg Notifier</h1>
        <p><span class="status-dot"></span>Secret · Eternal · Divine</p>
      </div>
      <button class="burger" id="burger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="card rift-card" id="riftCard">
      <div class="rift-title">Rift actual</div>
      <div class="rift-meta" id="riftMeta">Esperando info del Rift...</div>
      <div id="riftPets"></div>
    </div>

    <div class="card">
      <div class="session-header">
        <label>Huevos OP</label>
        <button class="btn-clear-session" id="btnClearSession">Borrar lista</button>
      </div>
      <div class="last-seen" id="lastSeen"></div>
      <div class="egg-list" id="eggList">
        <div class="egg-empty">Esperando huevos OP...</div>
      </div>
    </div>
    <footer>Actualizacion automatica Firebase · cada 8s · Datos desde el bot</footer>
  </div>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-title">Ajustes</div>
    <div class="menu-row">
      <label>Notificaciones en tiempo real</label>
      <button class="toggle-pill off" id="btnNotif">Off</button>
    </div>
    <div class="filters-title">Filtros</div>
    <p class="filters-desc">Los que esten en <b style="color:#86efac">verde</b> recibiras notificacion. Rojo = off. Amarillo = personalizado.</p>
    <div id="filterCats"></div>
  </aside>
  <div class="toast" id="toast">Listo!</div>

  <script>
    const CATALOG = {
      secreto: {
        label: 'Secreto',
        eggs: [
          'King Snake','Yeti','Cerberus','Kraken','TRex','T-Rex','Tralaledon',
          'Cosmic Skeleton Boss','Cosmic Dragon','Stag','Mutant Shark',
          'Gargoyle','Pure Jellyfish','Centaur','RazorFang','Electric Eel',
          'Luminous Spike','Luminous Spirit Manta','Luminous Abyss Shark',
          'Abyss Overlord','Wendigo','Mawbreaker','Shardwing'
        ]
      },
      eterno: {
        label: 'Eterno',
        eggs: [
          'Ice Dragon','Phoenix','Lava Dragon','El Maja','Mosasaurus',
          'Eternal Lunar Dragon','Oni Tiger','Gorilla King','Pegasus',
          'Skeleton Horse','Equinox','Terra Snapper',
          'Luminous Electric Eel','Luminous Terra Snapper',
          'World Eater','Shattered Drake','Void Serpent'
        ]
      },
      divino: {
        label: 'Divino',
        eggs: [
          'Unicorn','Kitsune','Nightflame','ArchAngel','World Burner',
          'Aetheron','Cthulhu','Luminous Cthulhu','Shattered Colossus'
        ]
      }
    };


    // ===== Imagenes huevo / mascota =====
    const IMG_CACHE_KEY = 'egg_img_cache_v1';
    function loadImgCache() {
      try { return JSON.parse(localStorage.getItem(IMG_CACHE_KEY) || '{}'); }
      catch (e) { return {}; }
    }
    function saveImgCache(c) {
      localStorage.setItem(IMG_CACHE_KEY, JSON.stringify(c));
    }
    let imgCache = loadImgCache();

    // Pack fijo de emojis Discord (huevo / mascota)
    // Formato: 'nombre': { egg: 'ID', pet: 'ID' }  — pet puede ser igual al egg si solo hay uno
    const IMAGE_PACK = {
      // ===== SECRETO =====
      'king snake': { egg: null, pet: null },
      'yeti': { egg: null, pet: null },
      'cerberus': { egg: null, pet: null },
      'kraken': { egg: null, pet: null },
      'trex': { egg: '1547091154850545794', pet: '1547091154850545794' },
      't-rex': { egg: '1547091154850545794', pet: '1547091154850545794' },
      'tralaledon': { egg: '1547091152518258810', pet: '1547091152518258810' },
      'cosmic skeleton boss': { egg: null, pet: null },
      'cosmic dragon': { egg: null, pet: null },
      'stag': { egg: null, pet: null },
      'mutant shark': { egg: null, pet: null },
      'gargoyle': { egg: '1548678018950758404', pet: '1548678018950758404' },
      'pure jellyfish': { egg: '1548678024512274564', pet: '1548678024512274564' },
      'centaur': { egg: null, pet: null },
      'razorfang': { egg: null, pet: null },
      'electric eel': { egg: null, pet: null },
      'luminous spike': { egg: null, pet: null },
      'luminous spirit manta': { egg: null, pet: null },
      'luminous abyss shark': { egg: null, pet: null },
      'abyss overlord': { egg: null, pet: null },
      'wendigo': { egg: null, pet: null },
      'mawbreaker': { egg: null, pet: null },
      'shardwing': { egg: '1546007531711635486', pet: '1546007531711635486' },
      // ===== ETERNO =====
      'ice dragon': { egg: null, pet: null },
      'phoenix': { egg: null, pet: null },
      'lava dragon': { egg: null, pet: null },
      'el maja': { egg: null, pet: null },
      'mosasaurus': { egg: '1547091132276809768', pet: '1547091132276809768' },
      'eternal lunar dragon': { egg: null, pet: null },
      'oni tiger': { egg: null, pet: null },
      'gorilla king': { egg: null, pet: null },
      'pegasus': { egg: null, pet: null },
      'skeleton horse': { egg: null, pet: null },
      'equinox': { egg: null, pet: null },
      'terra snapper': { egg: null, pet: null },
      'luminous electric eel': { egg: null, pet: null },
      'luminous terra snapper': { egg: null, pet: null },
      'world eater': { egg: null, pet: null },
      'shattered drake': { egg: '1546007536078028890', pet: '1546007536078028890' },
      'void serpent': { egg: null, pet: null },
      // ===== DIVINO =====
      'unicorn': { egg: null, pet: null },
      'kitsune': { egg: null, pet: null },
      'nightflame': { egg: null, pet: null },
      'archangel': { egg: null, pet: null },
      'world burner': { egg: null, pet: null },
      'aetheron': { egg: null, pet: null },
      'cthulhu': { egg: null, pet: null },
      'luminous cthulhu': { egg: null, pet: null },
      'shattered colossus': { egg: '1546007534131744899', pet: '1546007534131744899' },
      // Rift extras
      'sharding': { egg: '1546007529375666256', pet: '1546007529375666256' },
      'shattered ram': { egg: '1546007538850340985', pet: '1546007538850340985' }
    };

    // compat nombre viejo
    const DISCORD_EGG = {};
    Object.keys(IMAGE_PACK).forEach(function(k) {
      if (IMAGE_PACK[k].egg) DISCORD_EGG[k] = IMAGE_PACK[k].egg;
    });

    function discordUrl(id) {
      if (!id) return '';
      return 'https://cdn.discordapp.com/emojis/' + id + '.png?size=128&quality=lossless';
    }

    function wikiUrl(name, kind) {
      var base = (name || '').trim();
      var file = kind === 'egg' ? (base + ' Egg') : base.replace(/ Egg$/i, '');
      file = file.replace(/\s+/g, '_');
      return 'https://stealanegg.fandom.com/wiki/Special:FilePath/' + encodeURIComponent(file + '.png');
    }

    function rememberImage(name, url, kind) {
      if (!name || !url) return;
      var k = name.toLowerCase().replace(/\s+/g, ' ').trim();
      var cur = imgCache[k];
      if (typeof cur === 'string') cur = { egg: cur };
      if (!cur || typeof cur !== 'object') cur = {};
      if (kind === 'pet') cur.pet = url;
      else cur.egg = url;
      imgCache[k] = cur;
      saveImgCache(imgCache);
    }

    function cacheEntry(name) {
      var k = (name || '').toLowerCase().replace(/\s+/g, ' ').trim();
      var e = imgCache[k] || imgCache[k.replace(/ egg$/, '')] || {};
      if (typeof e === 'string') return { egg: e, pet: '' };
      return { egg: e.egg || '', pet: e.pet || '' };
    }

    function packEntry(name) {
      var k = (name || '').toLowerCase().replace(/\s+/g, ' ').trim();
      return IMAGE_PACK[k] || IMAGE_PACK[k.replace(/ egg$/, '')] || null;
    }

    function eggImage(name) {
      if (!name) return '';
      var c = cacheEntry(name);
      if (c.egg) return c.egg;
      var pack = packEntry(name);
      if (pack && pack.egg) return discordUrl(pack.egg);
      var k = name.toLowerCase().replace(/\s+/g, ' ').trim();
      if (DISCORD_EGG[k]) return discordUrl(DISCORD_EGG[k]);
      return '';
    }

    function petImage(name) {
      if (!name) return '';
      var c = cacheEntry(name);
      if (c.pet) return c.pet;
      var pack = packEntry(name);
      if (pack && pack.pet) return discordUrl(pack.pet);
      if (pack && pack.egg) return discordUrl(pack.egg);
      return eggImage(name);
    }

    function avatarUrl(name) {
      return 'https://ui-avatars.com/api/?name=' + encodeURIComponent((name || 'E').substring(0, 2)) +
        '&background=2a2a35&color=e8e8ed&size=128&bold=true&format=png';
    }

    function thumbHtml(name, cls) {
      cls = cls || 'filter-thumb';
      var egg = eggImage(name) || '';
      var pet = petImage(name) || '';
      var av = avatarUrl(name);
      var src = egg || pet || av;
      return '<img class="' + cls + ' js-swap-thumb" data-egg="' + egg +
        '" data-pet="' + pet + '" data-avatar="' + av +
        '" data-phase="egg" src="' + src +
        '" alt="" loading="lazy" onerror="window.__imgFallback&&window.__imgFallback(this)">';
    }

    window.__imgFallback = function(img) {
      var egg = img.getAttribute('data-egg') || '';
      var pet = img.getAttribute('data-pet') || '';
      var av = img.getAttribute('data-avatar') || '';
      var src = img.getAttribute('src') || '';
      if (egg && src.indexOf(egg) !== -1 && pet) { img.src = pet; return; }
      if (pet && src.indexOf(pet) !== -1 && av) { img.src = av; return; }
      if (av && src.indexOf('ui-avatars') === -1) { img.src = av; return; }
      img.style.opacity = '0.35';
    };

    function startThumbSwap() {
      if (window._thumbSwap) clearInterval(window._thumbSwap);
      window._thumbSwap = setInterval(function() {
        document.querySelectorAll('.js-swap-thumb').forEach(function(img) {
          var egg = img.getAttribute('data-egg') || '';
          var pet = img.getAttribute('data-pet') || '';
          if (!egg && !pet) return;
          var phase = img.getAttribute('data-phase') || 'egg';
          if (phase === 'egg' && pet) {
            img.setAttribute('data-phase', 'pet');
            img.src = pet;
          } else if (egg) {
            img.setAttribute('data-phase', 'egg');
            img.src = egg;
          }
        });
      }, 3000);
    }


    const SESSION_KEY = 'egg_session_v1';
    const SETTINGS_KEY = 'egg_settings_v1';
    const JSON_URL = 'https://steal-to-egg-notifier-default-rtdb.firebaseio.com/latest.json';

    const burger = document.getElementById('burger');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    const btnNotif = document.getElementById('btnNotif');
    const filterCats = document.getElementById('filterCats');
    const btnClearSession = document.getElementById('btnClearSession');
    const eggList = document.getElementById('eggList');
    const lastSeen = document.getElementById('lastSeen');
    const toast = document.getElementById('toast');

    let lastUpdatedAt = 0;
    let knownIds = new Set();

    function defaultSettings() {
      const eggs = {};
      Object.values(CATALOG).forEach(cat => {
        cat.eggs.forEach(n => { eggs[n.toLowerCase()] = true; });
      });
      return { notifications: false, eggs };
    }

    function loadSettings() {
      try {
        const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
        if (s && s.eggs) return s;
      } catch(e) {}
      return defaultSettings();
    }

    function saveSettings(s) {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
    }

    let settings = loadSettings();

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 1800);
    }

    function openMenu() {
      drawer.classList.add('open');
      overlay.classList.add('show');
      burger.classList.add('open');
    }
    function closeMenu() {
      drawer.classList.remove('open');
      overlay.classList.remove('show');
      burger.classList.remove('open');
    }

    burger.addEventListener('click', function() {
      drawer.classList.contains('open') ? closeMenu() : openMenu();
    });
    overlay.addEventListener('click', closeMenu);

    function catState(key) {
      const list = CATALOG[key].eggs;
      var on = 0, off = 0;
      list.forEach(function(n) {
        if (settings.eggs[n.toLowerCase()] !== false) on++;
        else off++;
      });
      if (on === 0) return 'off';
      if (off === 0) return 'on';
      return 'custom';
    }

    function setCatAll(key, enabled) {
      CATALOG[key].eggs.forEach(function(n) {
        settings.eggs[n.toLowerCase()] = enabled;
      });
      saveSettings(settings);
      renderFilters();
    }

    function toggleEgg(name) {
      var k = name.toLowerCase();
      settings.eggs[k] = settings.eggs[k] === false ? true : false;
      saveSettings(settings);
      renderFilters();
    }

    function randomPetFromCat(key) {
      var list = CATALOG[key].eggs;
      if (!list || !list.length) return '';
      return list[Math.floor(Math.random() * list.length)];
    }

    function startCatImageRotation() {
      if (window._catRot) clearInterval(window._catRot);
      window._catRot = setInterval(function() {
        document.querySelectorAll('[data-cat-preview]').forEach(function(el) {
          var key = el.getAttribute('data-cat-preview');
          var name = randomPetFromCat(key);
          var img = el.querySelector('img');
          if (img && name) {
            var egg = eggImage(name) || '';
            var pet = petImage(name) || '';
            img.alt = name;
            img.setAttribute('data-egg', egg);
            img.setAttribute('data-pet', pet);
            img.setAttribute('data-phase', 'egg');
            img.classList.add('js-swap-thumb');
            img.src = egg || pet || avatarUrl(name);
          }
        });
      }, 5000);
    }

    function renderFilters() {
      if (settings.notifications) {
        btnNotif.textContent = 'On';
        btnNotif.className = 'toggle-pill on';
      } else {
        btnNotif.textContent = 'Off';
        btnNotif.className = 'toggle-pill off';
      }

      filterCats.innerHTML = Object.keys(CATALOG).map(function(key) {
        var cat = CATALOG[key];
        var state = catState(key);
        var stateLabel = state === 'on' ? 'On' : state === 'off' ? 'Off' : 'Custom';
        var eggsHtml = cat.eggs.map(function(name) {
          var on = settings.eggs[name.toLowerCase()] !== false;
          return '<div class="egg-filter"><div class="egg-filter-left">' +
            thumbHtml(name) +
            '<span class="egg-filter-name">' + name + '</span></div>' +
            '<button class="toggle-pill ' + (on ? 'on' : 'off') +
            '" data-egg-btn="' + name + '">' + (on ? 'On' : 'Off') + '</button></div>';
        }).join('');

        var previewName = randomPetFromCat(key);
        return '<div class="cat" data-cat="' + key + '">' +
          '<div class="cat-header" data-cat-toggle="' + key + '">' +
          '<span class="cat-eggs-preview" data-cat-preview="' + key + '">' +
          '<img class="js-swap-thumb" data-egg="' + (eggImage(previewName)||'') + '" data-pet="' + (petImage(previewName)||'') + '" data-phase="egg" src="' + (eggImage(previewName)||petImage(previewName)||avatarUrl(previewName)) + '" alt="' + previewName + '"></span>' +
          '<span class="cat-name">' + cat.label + '</span>' +
          '<button class="toggle-pill ' + state + '" data-cat-btn="' + key + '">' + stateLabel + '</button>' +
          '<span class="cat-arrow">▶</span></div>' +
          '<div class="cat-body">' + eggsHtml + '</div></div>';
      }).join('');

      filterCats.querySelectorAll('[data-cat-toggle]').forEach(function(el) {
        el.addEventListener('click', function(e) {
          if (e.target.closest('[data-cat-btn]')) return;
          el.parentElement.classList.toggle('open');
        });
      });

      filterCats.querySelectorAll('[data-cat-btn]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var key = btn.getAttribute('data-cat-btn');
          var state = catState(key);
          setCatAll(key, state === 'off');
        });
      });

      filterCats.querySelectorAll('[data-egg-btn]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          toggleEgg(btn.getAttribute('data-egg-btn'));
        });
      });
      startCatImageRotation();
      startThumbSwap();
    }

    btnNotif.addEventListener('click', async function() {
      if (!settings.notifications) {
        if (!('Notification' in window)) {
          showToast('Este navegador no soporta notificaciones');
          return;
        }
        var perm = Notification.permission;
        if (perm === 'default') perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          showToast('Permiso denegado');
          return;
        }
        settings.notifications = true;
        saveSettings(settings);
        showToast('Notificaciones ON');
      } else {
        settings.notifications = false;
        saveSettings(settings);
        showToast('Notificaciones OFF');
      }
      renderFilters();
    });

    function eggAllowed(name) {
      if (!name) return false;
      var k = name.toLowerCase().replace(/\s+/g, ' ').trim();
      var variants = [k, k.replace(/ egg$/, ''), k.replace(/_/g, ' ')];
      for (var i = 0; i < variants.length; i++) {
        var v = variants[i];
        if (settings.eggs[v] === false) return false;
        if (settings.eggs[v] === true) return true;
      }
      for (var key in settings.eggs) {
        if (k.indexOf(key) !== -1 || key.indexOf(k) !== -1) {
          return settings.eggs[key] !== false;
        }
      }
      return true;
    }

    function notifyEgg(egg) {
      if (!settings.notifications) return;
      if (Notification.permission !== 'granted') return;
      if (!eggAllowed(egg.name)) return;
      var title = '🥚 ' + (egg.name || 'Huevo OP');
      var body = [
        egg.moneyText ? '💰 ' + egg.moneyText : '',
        egg.location ? '📍 ' + egg.location : ''
      ].filter(Boolean).join(' · ') || 'Nuevo huevo OP';
      try {
        var n = new Notification(title, {
          body: body,
          icon: egg.imageUrl || 'icon-192.png',
          tag: 'egg-' + (egg.name || Date.now()),
          renotify: true
        });
        n.onclick = function() { window.focus(); n.close(); };
      } catch(e) {}
    }

    function loadSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY) || '[]'); }
      catch(e) { return []; }
    }
    function saveSession(list) {
      localStorage.setItem(SESSION_KEY, JSON.stringify(list));
    }

    function formatMoney(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(n);
    }

    function timeAgo(ts) {
      if (!ts) return '';
      var diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 10) return 'hace unos segundos';
      if (diff < 60) return 'hace ' + diff + ' segundos';
      if (diff < 120) return 'hace 1 minuto';
      if (diff < 3600) return 'hace ' + Math.floor(diff / 60) + ' minutos';
      if (diff < 7200) return 'hace 1 hora';
      if (diff < 86400) return 'hace ' + Math.floor(diff / 3600) + ' horas';
      return 'hace ' + Math.floor(diff / 86400) + ' dias';
    }

    function renderSession() {
      var list = loadSession();
      if (list.length === 0) {
        eggList.innerHTML = '<div class="egg-empty">Esperando huevos OP...</div>';
        lastSeen.textContent = '';
        return;
      }
      var newest = Math.max.apply(null, list.map(function(e) { return e.timestamp || 0; }));
      lastSeen.textContent = newest ? ('Ultimo huevo: ' + timeAgo(newest)) : '';

      eggList.innerHTML = list.map(function(egg, i) {
        return '<div class="egg-item"><div class="egg-item-header">' +
          '<span class="egg-rank">#' + (i + 1) + '</span>' +
          (function(){ if(egg.imageUrl) rememberImage(egg.name, egg.imageUrl, 'egg'); if (egg.imageUrl) rememberImage(egg.name, egg.imageUrl, 'egg'); var src = egg.imageUrl || eggImage(egg.name) || petImage(egg.name); return '<img class="egg-thumb" src="' + src + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'' + petImage(egg.name || 'E') + '\'">'; })() +
          '<div class="egg-main"><div class="egg-name">' + (egg.name || 'Egg') + '</div>' +
          '<div class="egg-money">💰 ' + (egg.moneyText || formatMoney(egg.moneyValue || 0) + '/s') + '</div>' +
          '<div class="egg-ago">⏱ ' + timeAgo(egg.timestamp) + ' aparecio</div></div>' +
          '<span class="egg-arrow">▶</span></div><div class="egg-details">' +
          (egg.location ? '<div>😈 <b>Location:</b> ' + egg.location + '</div>' : '') +
          (egg.speed ? '<div>⚡ <b>Speed:</b> ' + egg.speed + '</div>' : '') +
          (egg.wiki ? '<div>🔍 <b>Wiki:</b> <a href="' + egg.wiki + '" target="_blank" rel="noopener">' + egg.wiki + '</a></div>' : '') +
          (egg.join ? '<div>🎮 <b>Join:</b> <a href="' + egg.join + '" target="_blank" rel="noopener">Click aqui</a></div>' : '') +
          (egg.fullText ? '<div style="margin-top:8px"><button class="btn-secondary" data-copy="' + i + '">Copiar texto</button></div>' : '') +
          '</div></div>';
      }).join('');

      eggList.querySelectorAll('.egg-item-header').forEach(function(h) {
        h.addEventListener('click', function() { h.parentElement.classList.toggle('open'); });
      });
      eggList.querySelectorAll('[data-copy]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var egg = loadSession()[parseInt(btn.getAttribute('data-copy'), 10)];
          if (egg && egg.fullText) {
            navigator.clipboard.writeText(egg.fullText).then(function() { showToast('Texto copiado'); });
          }
        });
      });
    }

    btnClearSession.addEventListener('click', function() {
      if (confirm('Borrar todos los huevos de la lista?')) {
        saveSession([]);
        renderSession();
        showToast('Lista borrada');
      }
    });


    const RIFT_KEY = 'egg_rift_v1';

    function loadRift() {
      try { return JSON.parse(localStorage.getItem(RIFT_KEY) || 'null'); }
      catch (e) { return null; }
    }
    function saveRift(r) {
      localStorage.setItem(RIFT_KEY, JSON.stringify(r));
    }

    function renderRift() {
      var rift = loadRift();
      var meta = document.getElementById('riftMeta');
      var petsEl = document.getElementById('riftPets');
      if (!meta || !petsEl) return;

      if (!rift || !rift.pets || !rift.pets.length) {
        meta.textContent = 'Esperando info del Rift...';
        petsEl.innerHTML = '';
        return;
      }

      var lines = [];
      if (rift.changedText) lines.push('Changed: ' + rift.changedText);
      if (rift.nextText) lines.push('Next: ' + rift.nextText);
      if (rift.timestamp) lines.push('Actualizado: ' + timeAgo(rift.timestamp));
      meta.innerHTML = lines.join('<br>');

      petsEl.innerHTML = rift.pets.map(function(pet) {
        var img = pet.imageUrl || petImage(pet.name);
        if (pet.imageUrl) rememberImage(pet.name, pet.imageUrl, 'pet');
        return '<div class="rift-pet">' +
          '<img src="' + img + '" alt="" onerror="this.style.opacity=0.3">' +
          '<span class="rift-pet-name">' + (pet.name || '?') + '</span>' +
          '<span class="rift-chance">🎲 ' + (pet.chance || '') + '</span>' +
          '<span class="rift-money">' + (pet.money || '') + '</span>' +
          '</div>';
      }).join('');
    }

    async function fetchRemoteEggs() {
      try {
        var res = await fetch(JSON_URL + '?t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'X-Bin-Meta': 'false' }
        });
        if (!res.ok) return;
        var json = await res.json();
        // JSONBin envuelve el contenido en "record"
        var data = json.record || json;
        if (!data || !Array.isArray(data.eggs)) return;
        if (data.updatedAt && data.updatedAt <= lastUpdatedAt) return;

        var prev = lastUpdatedAt;
        lastUpdatedAt = data.updatedAt || Date.now();

        if (prev > 0) {
          data.eggs.forEach(function(egg) {
            var id = (egg.name || '') + '-' + (egg.timestamp || '');
            if (!knownIds.has(id)) {
              knownIds.add(id);
              notifyEgg(egg);
            }
          });
        } else {
          data.eggs.forEach(function(egg) {
            knownIds.add((egg.name || '') + '-' + (egg.timestamp || ''));
          });
        }

        if (Array.isArray(data.eggs)) {
          data.eggs.forEach(function(egg) {
            if (egg.imageUrl) rememberImage(egg.name, egg.imageUrl, 'egg');
          });
          saveSession(data.eggs);
          renderSession();
        }
        if (data.rift) {
          saveRift(data.rift);
          renderRift();
        }
      } catch(e) {}
    }

    renderFilters();
    renderSession();
    // Ahorro de JSONBin: 20s y solo con pestaña visible
    var pollMs = 8000; // Firebase aguanta mas que JSONBin
    function schedulePoll() {
      if (window._eggPoll) clearInterval(window._eggPoll);
      window._eggPoll = setInterval(function() {
        if (document.hidden) return;
        fetchRemoteEggs();
      }, pollMs);
    }
    fetchRemoteEggs();
    schedulePoll();
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) fetchRemoteEggs();
    });
    setInterval(renderSession, 30000);
  </script>
</body>
</html>
