<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Egg Cleaner</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Egg Cleaner" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a22;
      --border: #2a2a35;
      --text: #e8e8ed;
      --muted: #9a9aad;
      --accent: #7c5cff;
      --accent-hover: #9478ff;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      line-height: 1.45;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 8px;
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      background: #121218;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: #555;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #2a2a35;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #353545;
    }

    .btn-copy {
      background: var(--success);
      color: #04140a;
      width: 100%;
      margin-top: 12px;
      font-size: 1.05rem;
      padding: 16px;
    }

    .btn-copy:hover {
      filter: brightness(1.08);
    }

    .btn-copy.copied {
      background: #16a34a;
    }

    .btn-url {
      background: #8b5cf6;
      color: white;
      width: 100%;
      margin-top: 10px;
      font-size: 1rem;
      padding: 14px;
    }

    .btn-url:hover {
      filter: brightness(1.08);
    }

    .btn-url:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-download {
      background: #3b82f6;
      color: white;
      width: 100%;
      margin-top: 10px;
      font-size: 1rem;
      padding: 14px;
    }

    .btn-download:hover {
      filter: brightness(1.08);
    }

    .btn-download:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .preview {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.98rem;
      line-height: 1.55;
      background: #121218;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      min-height: 120px;
    }

    .preview.empty {
      color: var(--muted);
      font-style: italic;
    }

    .egg-image-wrap {
      text-align: center;
      margin-bottom: 14px;
      display: none;
    }

    .egg-image-wrap.show {
      display: block;
    }

    .egg-image {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 12px;
      background: #1a1a22;
      border: 1px solid var(--border);
    }

    .egg-image.loading {
      opacity: 0.4;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 10px;
      min-height: 20px;
    }

    .status.success {
      color: var(--success);
    }

    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.78rem;
      color: #555;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #22c55e;
      color: #04140a;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🥚 Egg Cleaner</h1>
      <p>Pega el mensaje de Discord → listo para WhatsApp</p>
    </header>

    <div class="card">
      <label for="input">Mensaje de Discord</label>
      <textarea id="input" placeholder="Pega aquí el mensaje del bot de huevos..."></textarea>
      <div class="actions">
        <button class="btn-secondary" id="btnClear">Limpiar</button>
      </div>
    </div>

    <div class="card">
      <label>Versión limpia (WhatsApp)</label>
      <div class="egg-image-wrap" id="eggImageWrap">
        <img class="egg-image" id="eggImage" alt="Egg" />
      </div>
      <div class="preview empty" id="preview">Aquí aparecerá el mensaje listo para copiar...</div>
      <button class="btn-copy" id="btnCopy" disabled>Copiar para WhatsApp + Wiki</button>
      <button class="btn-url" id="btnUrl" disabled>Copiar URL Discord</button>
      <button class="btn-download" id="btnDownload" disabled>Descargar texto + imagen</button>
      <div class="status" id="status"></div>
    </div>

    <footer>
      Solo se procesa en tu dispositivo · Sin conexión a servidores
    </footer>
  </div>

  <div class="toast" id="toast">¡Copiado!</div>

  <script>
    const input = document.getElementById('input');
    const preview = document.getElementById('preview');
    const btnClear = document.getElementById('btnClear');
    const btnCopy = document.getElementById('btnCopy');
    const btnUrl = document.getElementById('btnUrl');
    const btnDownload = document.getElementById('btnDownload');
    const status = document.getElementById('status');
    const toast = document.getElementById('toast');
    const eggImageWrap = document.getElementById('eggImageWrap');
    const eggImage = document.getElementById('eggImage');

    let lastEggName = 'Egg';
    let lastEmojiId = null;
    let lastImageUrl = '';

    // Auto-transform on paste
    input.addEventListener('paste', () => {
      setTimeout(() => transform(), 50);
    });

    // Also transform when user finishes typing (debounced)
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        if (input.value.trim().length > 30) transform();
      }, 600);
    });

    btnClear.addEventListener('click', () => {
      input.value = '';
      preview.textContent = 'Aquí aparecerá el mensaje listo para copiar...';
      preview.classList.add('empty');
      btnCopy.disabled = true;
      btnUrl.disabled = true;
      btnDownload.disabled = true;
      status.textContent = '';
      eggImageWrap.classList.remove('show');
      eggImage.src = '';
      lastEggName = 'Egg';
      lastEmojiId = null;
      lastImageUrl = '';
      input.focus();
    });

    btnCopy.addEventListener('click', async () => {
      const text = preview.textContent;
      if (!text || preview.classList.contains('empty')) return;

      try {
        await navigator.clipboard.writeText(text);
        showToast('¡Copiado!');
        btnCopy.textContent = '✓ Copiado';
        btnCopy.classList.add('copied');
        status.textContent = 'Listo, pégalo en WhatsApp';
        status.classList.add('success');

        setTimeout(() => {
          btnCopy.textContent = 'Copiar para WhatsApp + Wiki';
          btnCopy.classList.remove('copied');
        }, 2000);
      } catch (err) {
        // Fallback for older browsers
        const range = document.createRange();
        range.selectNodeContents(preview);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
        sel.removeAllRanges();
        showToast('¡Copiado!');
      }
    });

    // Copy only the Discord image URL
    btnUrl.addEventListener('click', async () => {
      if (!lastImageUrl) return;

      try {
        await navigator.clipboard.writeText(lastImageUrl);
        showToast('URL Discord copiada');
        btnUrl.textContent = '✓ URL copiada';
        status.textContent = 'Pégala en WhatsApp (a veces no preview)';
        status.classList.add('success');

        setTimeout(() => {
          btnUrl.textContent = 'Copiar URL Discord';
        }, 2000);
      } catch (err) {
        const temp = document.createElement('textarea');
        temp.value = lastImageUrl;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast('URL Discord copiada');
      }
    });

    // Download both text + image
    btnDownload.addEventListener('click', async () => {
      const text = preview.textContent;
      if (!text || preview.classList.contains('empty')) return;

      const safeName = lastEggName.replace(/[^a-zA-Z0-9_\- ]/g, '').trim() || 'Egg';

      // 1. Download cleaned text as .txt
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const txtUrl = URL.createObjectURL(blob);
      const aTxt = document.createElement('a');
      aTxt.href = txtUrl;
      aTxt.download = `${safeName}.txt`;
      document.body.appendChild(aTxt);
      aTxt.click();
      document.body.removeChild(aTxt);
      URL.revokeObjectURL(txtUrl);

      // 2. Download egg image (if available)
      if (lastEmojiId && eggImage.src) {
        try {
          // Fetch the image so we can force a download with a nice name
          const response = await fetch(eggImage.src);
          const imgBlob = await response.blob();
          const imgUrl = URL.createObjectURL(imgBlob);
          const aImg = document.createElement('a');
          aImg.href = imgUrl;
          aImg.download = `${safeName}.png`;
          document.body.appendChild(aImg);
          // Small delay so both downloads trigger on mobile
          setTimeout(() => {
            aImg.click();
            document.body.removeChild(aImg);
            URL.revokeObjectURL(imgUrl);
          }, 300);
        } catch (e) {
          // Fallback: open image in new tab if fetch fails (CORS rare on Discord CDN)
          const aImg = document.createElement('a');
          aImg.href = eggImage.src;
          aImg.download = `${safeName}.png`;
          aImg.target = '_blank';
          aImg.click();
        }
      }

      showToast('Descargando...');
      status.textContent = 'Archivos descargados · muévelos a la carpeta Pet-Viewer';
      status.classList.add('success');
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function relativeTime(unix) {
      const now = Math.floor(Date.now() / 1000);
      const diff = now - unix;

      if (diff < 10) return 'hace unos segundos';
      if (diff < 60) return `hace ${diff} segundos`;
      if (diff < 120) return 'hace 1 minuto';
      if (diff < 3600) return `hace ${Math.floor(diff / 60)} minutos`;
      if (diff < 7200) return 'hace 1 hora';
      if (diff < 86400) return `hace ${Math.floor(diff / 3600)} horas`;
      return `hace ${Math.floor(diff / 86400)} días`;
    }

    function transform() {
      let raw = input.value.trim();
      if (!raw) {
        preview.textContent = 'Aquí aparecerá el mensaje listo para copiar...';
        preview.classList.add('empty');
        btnCopy.disabled = true;
        btnUrl.disabled = true;
        btnDownload.disabled = true;
        status.textContent = '';
        eggImageWrap.classList.remove('show');
        eggImage.src = '';
        lastEggName = 'Egg';
        lastEmojiId = null;
        lastImageUrl = '';
        return;
      }

      // Extract egg name (for filenames + wiki link)
      const nameMatch = raw.match(/\*\*Egg:\*\*\s*([^\n\r]+)/i) || raw.match(/Egg:\s*([^\n\r]+)/i);
      lastEggName = nameMatch ? nameMatch[1].trim() : 'Egg';

      // Build Fandom wiki URL (spaces → underscores)
      const wikiName = lastEggName.replace(/\s+/g, '_');
      const wikiUrl = `https://stealanegg.fandom.com/wiki/${encodeURIComponent(wikiName)}`;

      // Extract first custom Discord emoji (usually the egg one)
      const emojiMatch = raw.match(/<:([a-zA-Z0-9_]+):(\d+)>/);
      if (emojiMatch) {
        lastEmojiId = emojiMatch[2];
        // Clean URL (no query params) → better chance for WhatsApp preview
        lastImageUrl = `https://cdn.discordapp.com/emojis/${lastEmojiId}.png`;
        // For display inside the app we still use a sized version
        const displayUrl = `https://cdn.discordapp.com/emojis/${lastEmojiId}.png?size=128&quality=lossless`;
        eggImage.classList.add('loading');
        eggImage.src = displayUrl;
        eggImage.onload = () => {
          eggImage.classList.remove('loading');
          eggImageWrap.classList.add('show');
        };
        eggImage.onerror = () => {
          // Fallback to webp for display + clean URL
          lastImageUrl = `https://cdn.discordapp.com/emojis/${lastEmojiId}.webp`;
          eggImage.src = `https://cdn.discordapp.com/emojis/${lastEmojiId}.webp?size=128`;
          eggImage.onerror = () => {
            eggImageWrap.classList.remove('show');
            lastImageUrl = '';
          };
        };
      } else {
        lastEmojiId = null;
        lastImageUrl = '';
        eggImageWrap.classList.remove('show');
        eggImage.src = '';
      }

      // 1. Remove custom Discord emojis <:Name:ID>
      let text = raw.replace(/<:[a-zA-Z0-9_]+:\d+>/g, '');

      // 2. Convert Discord bold **text** → WhatsApp *text*
      text = text.replace(/\*\*(.*?)\*\*/g, '*$1*');

      // 3. Convert Discord relative timestamp <t:UNIX:R>
      text = text.replace(/<t:(\d+):R>/g, (_, ts) => relativeTime(parseInt(ts)));

      // 4. Extract clean Roblox link (remove [Click Here](url))
      text = text.replace(/\[Click Here\]\((https:\/\/www\.roblox\.com[^)]+)\)/gi, '$1');
      // Also handle any other markdown links
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '$2');

      // 5. Clean up extra spaces and empty lines
      text = text
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .join('\n');

      // 6. Add nice emojis at the start of known lines
      text = text
        .replace(/^\*?Egg:\*?\s*/im, '🥚 *Egg:* ')
        .replace(/^\*?Location:\*?\s*/im, '😈 *Location:* ')
        .replace(/^\*?Spawned:\*?\s*/im, '⏱ *Spawned:* ')
        .replace(/^\*?Money:\*?\s*/im, '💰 *Money:* ')
        .replace(/^\*?Recommended Speed:\*?\s*/im, '⚡ *Recommended Speed:* ')
        .replace(/^\*?Join Game:\*?\s*/im, '🎮 *Join Game:*\n');

      // Final cleanup of double spaces
      text = text.replace(/  +/g, ' ').trim();

      // Add Wiki section at the end
      text += `\n🔍 *Wiki:*\n${wikiUrl}`;

      preview.textContent = text;
      preview.classList.remove('empty');
      btnCopy.disabled = false;
      btnUrl.disabled = !lastImageUrl;
      btnDownload.disabled = false;
      status.textContent = 'Listo · toca "Copiar para WhatsApp + Wiki"';
      status.classList.remove('success');
    }

    // Focus input on load (mobile friendly)
    setTimeout(() => input.focus(), 300);
  </script>
</body>
</html>
